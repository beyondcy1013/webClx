<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能体协作 · webClx</title><link rel="stylesheet" href="/assets/styles.css?v=20260924collab1"><style>.collab-grid{display:grid;grid-template-columns:280px 320px minmax(0,1fr);gap:16px;padding:16px}.collab-card{background:var(--panel-bg,#151a22);border:1px solid var(--border-color,#303846);border-radius:12px;padding:14px;min-height:300px}.collab-list{display:grid;gap:8px;margin:12px 0}.collab-item{display:block;width:100%;text-align:left;padding:9px;border:1px solid #394354;border-radius:8px;background:transparent;color:inherit}.collab-item.active{border-color:#6ea8fe}.collab-form{display:grid;gap:8px}.collab-form input,.collab-form textarea,.collab-form select{width:100%;box-sizing:border-box;padding:8px;background:#0e131a;color:inherit;border:1px solid #394354;border-radius:7px}.message{border-bottom:1px solid #303846;padding:10px 0}.muted{opacity:.7;font-size:.9em}.error{color:#ff8383}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.history{max-height:52vh;overflow:auto}@media(max-width:900px){.collab-grid{grid-template-columns:1fr}}</style><script defer src="/assets/collaboration.js?v=20260924collab1"></script></head><body><div class="page"><header class="topbar slim browser-topbar"><nav class="tabs page-tabs"><a class="tab-button topbar-link-button" href="/terminal">终端管理</a><a class="tab-button topbar-link-button" href="/workspace">工作区</a><a class="tab-button topbar-link-button" href="/agent">DeepSeek Agent</a><a class="tab-button topbar-link-button active" href="/collaboration" aria-current="page">智能体协作</a></nav></header><main class="collab-grid"><section class="collab-card"><h2>智能体</h2><form id="agent-form" class="collab-form"><input name="agent_id" placeholder="agent_id" required><input name="name" placeholder="显示名称" required><input name="platform" placeholder="平台，例如 devin/codex"><button class="button primary">注册或更新</button></form><div id="agents" class="collab-list"></div></section><section class="collab-card"><h2>讨论组</h2><form id="group-form" class="collab-form"><input name="project_id" placeholder="project_id" required><input name="name" placeholder="讨论组名称" required><input name="owner_agent_id" placeholder="owner agent_id" required><textarea name="topic" placeholder="讨论目标"></textarea><button class="button primary">创建讨论组</button></form><div id="groups" class="collab-list"></div></section><section class="collab-card"><div class="toolbar"><h2 id="group-title">选择讨论组</h2><button id="refresh" class="button secondary" type="button">刷新</button><button id="reconcile" class="button secondary" type="button">重建 MD</button></div><div id="group-meta" class="muted"></div><form id="join-form" class="collab-form" hidden><div class="toolbar"><input name="agent_id" placeholder="加入的 agent_id" required><select name="role"><option value="member">member</option><option value="observer">observer</option></select><button class="button secondary">加入</button></div></form><div id="messages" class="history"></div><form id="ack-form" class="collab-form" hidden><div class="toolbar"><input name="message_id" placeholder="message_id" required><input name="agent_id" placeholder="ACK agent_id" required><select name="status"><option value="read">read</option><option value="accepted">accepted</option><option value="completed">completed</option><option value="rejected">rejected</option><option value="failed">failed</option></select><button class="button secondary">提交 ACK</button></div></form><form id="message-form" class="collab-form" hidden><input name="sender_agent_id" placeholder="发言 agent_id" required><select name="kind"><option value="speech">发言</option><option value="task">任务</option><option value="reply">回复</option><option value="status">状态</option><option value="handoff">交接</option></select><textarea name="text" placeholder="消息内容" required></textarea><input name="idempotency_key" placeholder="幂等键（建议填写）"><button class="button primary">发送</button></form><details><summary>Markdown 历史</summary><pre id="markdown"></pre></details><div id="error" class="error"></div></section></main></div></body></html>
