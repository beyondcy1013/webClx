    <script defer src="/assets/agent-terminal-profiles.js?v=20260731a"></script>
    <script>
      (() => {
        "use strict";

        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        let currentSessionId = null;
        let isStreaming = false;
        let availableModels = [];
        let availablePresets = [];
        let availableSkills = null;
        let skillChoicesPromise = null;
        let visibleSkills = [];
        let activeSkillIndex = 0;
        let pendingAttachments = [];
        let lastTurn = null;
        let runWatchTimer = null;
        let streamFinished = false;
        let pendingModelSwitch = null;
        let previousModel = "";
        let currentSessionApprovalPolicy = "ask_once";
        const approvalPromptDismissed = new Set();

        async function api(path, options = {}) {
          const resp = await fetch(path, {
            ...options,
            headers: { "Content-Type": "application/json", ...options.headers },
          });
          if (!resp.ok) {
            const text = await resp.text();
            throw new Error(text || `HTTP ${resp.status}`);
          }
          return resp;
        }

        async function apiJson(path, options = {}) {
          const resp = await api(path, options);
          return resp.json();
        }

        // ---- Session list ----
        async function loadSessions() {
          const data = await apiJson("/api/agent/sessions");
          renderSessionList(data.sessions || []);
        }

        function renderSessionList(sessions) {
          const list = $("#agent-session-list");
          if (sessions.length === 0) {
            list.innerHTML = '<div style="padding: 14px; color: var(--muted); font-size: var(--font-size-tier-2);">暂无会话</div>';
            return;
          }
          list.innerHTML = sessions.map(s => `
            <div class="agent-session-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
              <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(s.title)}</span>
              <span class="session-delete" data-id="${s.id}" title="删除">&times;</span>
            </div>
          `).join("");
        }

        // ---- Session chat ----
        async function selectSession(sessionId) {
          if (isStreaming) return;
          currentSessionId = sessionId;
          const session = await apiJson(`/api/agent/sessions/${sessionId}`);
          renderSessionList(await apiJson("/api/agent/sessions").then(d => d.sessions || []));
          renderChatArea(session);
          await loadPresets(session.api_preset_id || "");
          await loadModels(session.model, session.api_preset_id || "");
          rebuildLastTurn(session);
          currentSessionApprovalPolicy = session.approval_policy || "ask_once";
          await checkRunStatus();
          maybeShowApprovalPrompt(session);
        }

        function renderChatArea(session) {
          const area = $("#agent-chat-area");
          const messagesHtml = renderStoredMessages(session.messages || []);
          area.innerHTML = `
            <div class="agent-chat-head">
              <button class="agent-sidebar-toggle" type="button" data-agent-sidebar-toggle aria-label="打开 Agent 菜单">&#9776;</button>
              <input type="text" class="agent-chat-title" value="${escapeAttr(session.title)}" id="agent-title-input" />
              <div class="agent-context-meter" id="agent-context-meter" title="上下文窗口用量">
                <div class="agent-context-label" id="agent-context-status">${escapeHtml(session.model)} · 计算中</div>
                <div class="agent-context-track"><span class="agent-context-progress" id="agent-context-progress"></span></div>
              </div>
              <div class="agent-chat-routing">
                <select class="agent-model-select agent-preset-select" id="agent-session-preset-select" aria-label="API 预设" title="API 预设">
                  <option value="${escapeAttr(session.api_preset_id || '')}">加载预设...</option>
                </select>
                <select class="agent-model-select" id="agent-model-select" aria-label="模型" title="模型">
                  <option value="${escapeAttr(session.model)}">${escapeHtml(session.model)}</option>
                </select>
                <select class="agent-model-select" id="agent-sandbox-select" aria-label="沙箱" title="沙箱">
                  <option value="default">默认沙箱</option>
                  <option value="read_only">只读</option>
                  <option value="full_access">全开</option>
                </select>
              </div>
              <button class="agent-terminal-action" id="agent-compact-btn" type="button" title="压缩较早的对话上下文">压缩</button>
              <button class="agent-terminal-action agent-retry-btn" id="agent-retry-btn" type="button" title="重新发送上一轮消息" disabled>重试</button>
              <button class="agent-terminal-action" id="agent-summary-btn" type="button" title="查看或编辑压缩摘要">摘要</button>
              <button class="agent-terminal-action" id="agent-checkpoint-btn" type="button" title="查看检查点并撤销修改">检查点</button>
              <button class="agent-terminal-action" id="agent-approvals-btn" type="button" title="待人工批准的请求">批准<span class="agent-approvals-badge" id="agent-approvals-badge">0</span></button>
              <button class="agent-new-btn" id="agent-clear-btn" style="background: var(--field-bg); color: var(--text); border: 1px solid var(--field-border);">清空</button>
            </div>
            <div class="agent-run-banner" id="agent-run-banner" hidden>
              <span id="agent-run-banner-text">智能体仍在运行…</span>
              <button class="agent-terminal-action" id="agent-run-refresh-btn" type="button">刷新</button>
            </div>
            <div class="agent-run-banner" id="agent-interrupted-banner" hidden>
              <span>上次运行因服务重启中断，会话进度保留到中断前；可点「重试」重新执行上一轮。</span>
            </div>
            <div class="agent-messages" id="agent-messages">${messagesHtml}</div>
            <div class="agent-input-area">
              <div class="agent-input-shell">
                <div class="agent-skill-picker" id="agent-skill-picker" role="listbox" aria-label="可用 Skills" hidden>
                  <div class="agent-skill-picker-head"><strong>Skills</strong><span class="agent-skill-picker-count">加载中</span></div>
                  <div class="agent-skill-options" id="agent-skill-options"></div>
                </div>
                <div class="agent-attachment-preview" id="agent-attachment-preview"></div>
                <div class="agent-input-row">
                  <button class="agent-skill-button" id="agent-skill-button" type="button" aria-label="选择 Skill" title="选择 Skill" aria-expanded="false" aria-controls="agent-skill-picker">$</button>
                  <label class="agent-skill-button" for="agent-attachment-input" aria-label="添加图片" title="添加图片" style="display:grid;place-items:center;font-family:var(--font-family-sans);font-size:13px;">图片</label>
                  <input id="agent-attachment-input" type="file" accept="image/*" multiple hidden />
                  <textarea class="agent-input" id="agent-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1" aria-autocomplete="list" aria-expanded="false" aria-controls="agent-skill-picker"></textarea>
                  <button class="agent-send-btn" id="agent-send-btn">发送</button>
                </div>
              </div>
              <div class="agent-hint">内置 Agent 可检查和修改工作区、运行验证，也能按需使用专项 skill。</div>
            </div>
          `;
          populateModelSelect(session.model);
          const sandboxSelect = $("#agent-sandbox-select");
          if (sandboxSelect) sandboxSelect.value = session.sandbox_mode || "default";
          const interruptedBanner = $("#agent-interrupted-banner");
          if (interruptedBanner) interruptedBanner.hidden = !session.run_interrupted_at;
          scrollToBottom();
          bindChatEvents();
          refreshContextStatus();
          refreshApprovals();
        }

        function renderStoredMessages(messages, render = renderMessage) {
          const toolResults = new Map();
          for (const message of messages) {
            if (message.role !== "tool" || !message.tool_call_id) continue;
            const result = message.content;
            const legacyError = result
              && typeof result === "object"
              && !Array.isArray(result)
              && typeof result.error === "string"
              && Object.keys(result).length === 1;
            toolResults.set(message.tool_call_id, {
              result,
              is_error: typeof message.is_error === "boolean" ? message.is_error : Boolean(legacyError),
            });
          }
          return messages
            .filter(message => message.role !== "tool")
            .map(message => render(message, toolResults))
            .join("");
        }

        function renderMessage(msg, toolResults = new Map()) {
          if (msg.role === "user") {
            return renderUserMessage(msg.content);
          }
          if (msg.role === "assistant") {
            const content = strVal(msg.content);
            let html = '<div class="agent-msg assistant"><div class="agent-msg-role">Assistant</div>';
            if (msg.reasoning_content) {
              html += `<details class="agent-reasoning"><summary>思考过程</summary><div class="agent-reasoning-content">${escapeHtml(msg.reasoning_content)}</div></details>`;
            }
            if (content) html += `<div class="agent-msg-content">${escapeHtml(content)}</div>`;
            if (msg.tool_calls) {
              for (const tc of msg.tool_calls) {
                html += renderToolCallCard(tc, toolResults.get(tc.id) || null);
              }
            }
            html += '</div>';
            return html;
          }
          return '';
        }

        function renderUserMessage(content) {
          const items = Array.isArray(content) ? content : [{ type: "text", text: strVal(content) }];
          const text = items.filter(item => item?.type === "text").map(item => item.text || "").join("\n");
          const images = items
            .filter(item => item?.type === "image_url" && item.image_url?.url)
            .map(item => `<img src="${escapeAttr(item.image_url.url)}" alt="${escapeAttr(item.name || '附件图片')}" />`)
            .join("");
          return `<div class="agent-msg user"><div class="agent-msg-role">你</div><div class="agent-msg-content">${escapeHtml(text)}${images ? `<div class="agent-msg-images">${images}</div>` : ""}</div></div>`;
        }

        function renderToolCallCard(tc, result) {
          const args = tc.function?.arguments || "{}";
          const cardId = 'tc-' + tc.id;
          let badgeHtml = '<span class="tool-badge running">运行中</span>';
          if (result) {
            badgeHtml = result.is_error
              ? '<span class="tool-badge error">错误</span>'
              : '<span class="tool-badge ok">完成</span>';
          }
          let bodyHtml = `<div class="agent-tool-meta">参数:</div><pre>${escapeHtml(formatJson(args))}</pre>`;
          if (result) {
            bodyHtml += `<div class="agent-tool-meta">结果:</div><pre>${escapeHtml(typeof result.result === 'string' ? result.result : JSON.stringify(result.result, null, 2))}</pre>`;
            if (!result.is_error && result.result && typeof result.result === "object" && result.result.checkpoint_id) {
              bodyHtml += `<button class="agent-checkpoint-restore" type="button" data-restore-checkpoint="${escapeAttr(result.result.checkpoint_id)}">撤销到检查点 ${escapeHtml(result.result.checkpoint_id)}</button>`;
            }
          }
          return `
            <div class="agent-tool-card" id="${cardId}">
              <div class="agent-tool-head" onclick="document.getElementById('${cardId}-body').classList.toggle('open')">
                <span class="tool-icon">&#9881;</span>
                <span class="tool-name">${escapeHtml(tc.function?.name || '')}</span>
                ${badgeHtml}
              </div>
              <div class="agent-tool-body" id="${cardId}-body">${bodyHtml}</div>
            </div>`;
        }

        // ---- Send message + SSE handling ----
        async function sendMessage() {
          if (isStreaming) {
            const queuedInput = $("#agent-input");
            const queuedMessage = queuedInput?.value.trim() || "";
            if (!queuedMessage && !pendingAttachments.length) {
              await stopCurrentTurn();
              return;
            }
          }
          const input = $("#agent-input");
          const message = input.value.trim();
          if ((!message && !pendingAttachments.length) || !currentSessionId) return;
          if (!pendingAttachments.length && await handleSlashCommand(message)) {
            input.value = "";
            autoResize(input);
            return;
          }
          const attachments = pendingAttachments.splice(0);
          lastTurn = {
            message,
            attachments: attachments.map(item => ({ ...item })),
          };
          renderRetryButton();
          streamFinished = false;

          isStreaming = true;
          closeSkillPicker();
          input.value = "";
          autoResize(input);
          renderAttachmentPreview();

          // Optimistic render user message
          const messagesDiv = $("#agent-messages");
          messagesDiv.insertAdjacentHTML("beforeend",
            renderUserMessage([
              { type: "text", text: message },
              ...attachments.map(item => ({ type: "image_url", image_url: { url: item.data_url }, name: item.name })),
            ]));
          scrollToBottom();

          const sendBtn = $("#agent-send-btn");
          sendBtn.disabled = false;
          sendBtn.textContent = "停止";

          // Thinking indicator
          const thinkingId = 'thinking-' + Date.now();
          messagesDiv.insertAdjacentHTML("beforeend",
            `<div class="agent-msg assistant" id="${thinkingId}"><div class="agent-msg-role">Assistant</div><div class="agent-thinking"><span class="dot">&bull;</span><span class="dot">&bull;</span><span class="dot">&bull;</span></div></div>`);
          scrollToBottom();

          let keepStreaming = false;
          try {
            const resp = await fetch(`/api/agent/sessions/${currentSessionId}/chat`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message, attachments }),
            });
            if (!resp.ok) {
              const errText = await resp.text();
              throw new Error(errText);
            }

            const responseType = resp.headers.get("content-type") || "";
            if (responseType.includes("application/json")) {
              const result = await resp.json();
              if (result.queued) {
                keepStreaming = true;
                const thinkingEl = document.getElementById(thinkingId);
                if (thinkingEl) thinkingEl.remove();
                messagesDiv.insertAdjacentHTML("beforeend",
                  '<div class="agent-queued-banner">消息已暂存，将在当前工具调用完成后发送</div>');
                return;
              }
              throw new Error("消息发送失败");
            }

            // Process SSE stream
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let assistantDiv = null;

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines) {
                if (!line.startsWith("data:")) continue;
                const dataStr = line.slice(5).trim();
                if (!dataStr) continue;
                let event;
                try { event = JSON.parse(dataStr); } catch { continue; }
                handleSseEvent(event, thinkingId);
              }
            }
          } catch (e) {
            const messagesDiv2 = $("#agent-messages");
            messagesDiv2.insertAdjacentHTML("beforeend", renderErrorBannerHtml(e.message));
            scrollToBottom();
            refreshApprovals();
          } finally {
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            isStreaming = keepStreaming;
            sendBtn.disabled = false;
            sendBtn.textContent = "发送";
            refreshContextStatus();
            if (!keepStreaming) {
              if (streamFinished) {
                stopRunWatch();
              } else {
                await checkRunStatus();
              }
            }
            refreshApprovals();
          }
        }

        async function handleSlashCommand(message) {
          const command = message.trim().toLowerCase();
          if (!/^\/(compact|status|model)(?:\s+.*)?$/.test(command)) return false;
          const messagesDiv = $("#agent-messages");
          if (command === "/compact") {
            await compactCurrentSession();
            return true;
          }
          if (command === "/status") {
            await refreshContextStatus();
            messagesDiv?.insertAdjacentHTML("beforeend", '<div class="agent-status-banner">上下文状态已刷新</div>');
            scrollToBottom();
            return true;
          }
          const modelSelect = $("#agent-model-select");
          modelSelect?.focus();
          modelSelect?.scrollIntoView({ block: "nearest", inline: "nearest" });
          messagesDiv?.insertAdjacentHTML("beforeend", '<div class="agent-status-banner">已打开模型选择</div>');
          scrollToBottom();
          return true;
        }

        function handleSseEvent(event, thinkingId) {
          const messagesDiv = $("#agent-messages");
          if (event.type === "assistant_delta") {
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            const streamId = `assistant-stream-${thinkingId}`;
            let streamMessage = document.getElementById(streamId);
            if (!streamMessage) {
              messagesDiv.insertAdjacentHTML("beforeend", `<div class="agent-msg assistant" id="${streamId}"><div class="agent-msg-role">Assistant</div><div class="agent-msg-content"></div></div>`);
              streamMessage = document.getElementById(streamId);
            }
            streamMessage.querySelector(".agent-msg-content").textContent += event.content || "";
            scrollToBottom();
          } else if (event.type === "reasoning_delta") {
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            const reasoningId = `reasoning-${thinkingId}`;
            let reasoningBlock = document.getElementById(reasoningId);
            if (!reasoningBlock) {
              messagesDiv.insertAdjacentHTML("beforeend",
                `<div class="agent-msg assistant" id="${reasoningId}"><div class="agent-msg-role">Assistant</div><details class="agent-reasoning" open><summary>思考过程</summary><div class="agent-reasoning-content"></div></details></div>`);
              reasoningBlock = document.getElementById(reasoningId);
            }
            const content = reasoningBlock.querySelector(".agent-reasoning-content");
            if (content) content.textContent += event.content || "";
            scrollToBottom();
          } else if (event.type === "assistant_message") {
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            messagesDiv.insertAdjacentHTML("beforeend",
              `<div class="agent-msg assistant"><div class="agent-msg-role">Assistant</div><div class="agent-msg-content">${escapeHtml(event.content)}</div></div>`);
            scrollToBottom();
          } else if (event.type === "notice") {
            messagesDiv.insertAdjacentHTML("beforeend",
              `<div class="agent-status-banner">${escapeHtml(event.message)}</div>`);
            scrollToBottom();
          } else if (event.type === "tool_call_start") {
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            document.getElementById(`assistant-stream-${thinkingId}`)?.removeAttribute("id");
            messagesDiv.insertAdjacentHTML("beforeend", renderToolCallCard({
              id: event.id,
              function: { name: event.name, arguments: event.arguments },
            }, null));
            scrollToBottom();
          } else if (event.type === "tool_result") {
            updateToolCard(event.id, event);
            // Re-add thinking indicator for next LLM call
            if (!document.getElementById(thinkingId)) {
              messagesDiv.insertAdjacentHTML("beforeend",
                `<div class="agent-msg assistant" id="${thinkingId}"><div class="agent-msg-role">Assistant</div><div class="agent-thinking"><span class="dot">&bull;</span><span class="dot">&bull;</span><span class="dot">&bull;</span></div></div>`);
              scrollToBottom();
            }
          } else if (event.type === "context_status") {
            renderContextStatus(event.status);
          } else if (event.type === "compact_start") {
            const compactBtn = $("#agent-compact-btn");
            if (compactBtn) {
              compactBtn.disabled = true;
              compactBtn.textContent = "压缩中";
            }
          } else if (event.type === "compact_done") {
            renderContextStatus(event.status);
            const compactBtn = $("#agent-compact-btn");
            if (compactBtn) {
              compactBtn.disabled = false;
              compactBtn.textContent = "压缩";
            }
            if (event.compacted) {
              openSummaryDialog().catch(() => {});
            }
          } else if (event.type === "error") {
            streamFinished = true;
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
            messagesDiv.insertAdjacentHTML("beforeend", renderErrorBannerHtml(event.message));
            scrollToBottom();
            refreshApprovals();
          } else if (event.type === "done") {
            streamFinished = true;
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
          } else if (event.type === "stopped") {
            streamFinished = true;
            const thinkingEl = document.getElementById(thinkingId);
            if (thinkingEl) thinkingEl.remove();
          }
        }

        async function stopCurrentTurn() {
          if (!currentSessionId || !isStreaming) return;
          const sendBtn = $("#agent-send-btn");
          sendBtn.disabled = true;
          sendBtn.textContent = "停止中";
          try {
            await apiJson(`/api/agent/sessions/${currentSessionId}/chat/stop`, { method: "POST" });
          } catch (error) {
            sendBtn.disabled = false;
            sendBtn.textContent = "停止";
            throw error;
          }
        }

        function formatTokenCount(value) {
          const tokens = Math.max(0, Number(value) || 0);
          if (tokens >= 1_000_000) return `${(tokens / 1_000_000).toFixed(tokens >= 10_000_000 ? 0 : 1)}M`;
          if (tokens >= 1_000) return `${(tokens / 1_000).toFixed(tokens >= 100_000 ? 0 : 1)}K`;
          return String(Math.round(tokens));
        }

        function renderContextStatus(status) {
          if (!status) return;
          const label = $("#agent-context-status");
          const progress = $("#agent-context-progress");
          const meter = $("#agent-context-meter");
          const percent = Math.max(0, Number(status.used_percent) || 0);
          const display = `${status.model || "未知模型"} · ${formatTokenCount(status.used_tokens)} / ${formatTokenCount(status.context_window)} · ${percent}%`;
          if (label) label.textContent = display;
          if (meter) meter.title = `${display}；用量来源 ${status.context_usage_source === "api" ? "API" : "估算"}；自动压缩阈值 ${formatTokenCount(status.compact_threshold)}`;
          if (progress) {
            progress.style.width = `${Math.min(100, percent)}%`;
            progress.classList.toggle("warning", Number(status.used_tokens) >= Number(status.compact_threshold));
          }
        }

        async function refreshContextStatus() {
          if (!currentSessionId) return;
          try {
            const status = await apiJson(`/api/agent/sessions/${currentSessionId}/context`);
            renderContextStatus(status);
          } catch (error) {
            const label = $("#agent-context-status");
            if (label) label.textContent = `上下文状态不可用`;
          }
        }

        async function compactCurrentSession() {
          if (!currentSessionId || isStreaming) return;
          const compactBtn = $("#agent-compact-btn");
          if (compactBtn) {
            compactBtn.disabled = true;
            compactBtn.textContent = "压缩中";
          }
          try {
            const result = await apiJson(`/api/agent/sessions/${currentSessionId}/compact`, { method: "POST" });
            renderContextStatus(result.status);
            if (result.compacted) {
              const session = await apiJson(`/api/agent/sessions/${currentSessionId}`);
              const messages = $("#agent-messages");
              if (messages) messages.innerHTML = renderStoredMessages(session.messages || []);
              scrollToBottom();
              openSummaryDialog().catch(() => {});
            }
          } catch (error) {
            const messages = $("#agent-messages");
            messages?.insertAdjacentHTML("beforeend", `<div class="agent-error-banner">${escapeHtml(error.message)}</div>`);
            scrollToBottom();
          } finally {
            if (compactBtn) {
              compactBtn.disabled = false;
              compactBtn.textContent = "压缩";
            }
          }
        }

        function updateToolCard(toolCallId, result) {
          const card = document.getElementById("tc-" + toolCallId);
          if (!card) return;
          const badge = card.querySelector(".tool-badge");
          if (badge) {
            badge.className = "tool-badge " + (result.is_error ? "error" : "ok");
            badge.textContent = result.is_error ? "错误" : "完成";
          }
          const body = card.querySelector(".agent-tool-body");
          if (body) {
            body.insertAdjacentHTML("beforeend",
              `<div class="agent-tool-meta">结果:</div><pre>${escapeHtml(typeof result.result === 'string' ? result.result : JSON.stringify(result.result, null, 2))}</pre>`);
          }
        }

        // ---- Retry last turn ----
        function rebuildLastTurn(session) {
          let found = null;
          for (const msg of session.messages || []) {
            if (msg.role !== "user") continue;
            const items = Array.isArray(msg.content)
              ? msg.content
              : [{ type: "text", text: strVal(msg.content) }];
            const text = items
              .filter(item => item?.type === "text")
              .map(item => item.text || "")
              .join("\n");
            const attachments = items
              .filter(item => item?.type === "image_url" && item.image_url?.url)
              .map(item => {
                let mimeType = "image/png";
                const match = String(item.image_url.url || "").match(/^data:([^;]+);base64,/);
                if (match) mimeType = match[1];
                return { data_url: item.image_url.url, mime_type: mimeType, name: item.name || "附件图片" };
              });
            found = { message: text, attachments };
          }
          lastTurn = found;
          renderRetryButton();
        }

        function renderRetryButton() {
          const button = $("#agent-retry-btn");
          if (button) button.disabled = !lastTurn || isStreaming;
        }

        async function retryLastTurn() {
          if (!currentSessionId || !lastTurn || isStreaming) return;
          const input = $("#agent-input");
          if (input) input.value = lastTurn.message || "";
          pendingAttachments = (lastTurn.attachments || []).map(item => ({ ...item }));
          renderAttachmentPreview();
          await sendMessage();
        }

        // ---- Run status recovery ----
        async function checkRunStatus() {
          if (!currentSessionId) return;
          let status;
          try {
            status = await apiJson(`/api/agent/sessions/${currentSessionId}/run`);
          } catch {
            return;
          }
          const banner = $("#agent-run-banner");
          if (status.running) {
            if (!isStreaming && banner) banner.hidden = false;
            if (!isStreaming) startRunWatch();
            return;
          }
          if (banner && !banner.hidden) {
            banner.hidden = true;
            stopRunWatch();
          }
        }

        function startRunWatch() {
          if (runWatchTimer) return;
          runWatchTimer = setInterval(async () => {
            if (!currentSessionId) {
              stopRunWatch();
              return;
            }
            try {
              const status = await apiJson(`/api/agent/sessions/${currentSessionId}/run`);
              if (!status.running) {
                stopRunWatch();
                const banner = $("#agent-run-banner");
                if (banner) banner.hidden = true;
                await selectSession(currentSessionId);
              }
            } catch {
              // transient network error; keep watching
            }
          }, 2000);
        }

        function stopRunWatch() {
          if (runWatchTimer) {
            clearInterval(runWatchTimer);
            runWatchTimer = null;
          }
        }

        // ---- Summary editing ----
        let currentContextFiles = [];

        async function openSummaryDialog() {
          if (!currentSessionId) return;
          const session = await apiJson(`/api/agent/sessions/${currentSessionId}`);
          currentContextFiles = session.context_files || [];
          const input = $("#agent-summary-input");
          if (input) input.value = session.context_summary || "";
          const filesEl = $("#agent-summary-files");
          if (filesEl) {
            filesEl.innerHTML = currentContextFiles.length
              ? currentContextFiles.map(file => `<span class="agent-file-chip">${escapeHtml(file)}</span>`).join("")
              : '<span style="color: var(--muted); font-size: var(--font-size-tier-1);">暂无相关文件</span>';
          }
          const status = $("#agent-summary-status");
          if (status) status.textContent = "";
          $("#agent-summary-dialog")?.showModal();
        }

        async function saveSummary() {
          if (!currentSessionId) return;
          const status = $("#agent-summary-status");
          if (status) status.textContent = "保存中…";
          try {
            const session = await apiJson(`/api/agent/sessions/${currentSessionId}/summary`, {
              method: "PUT",
              body: JSON.stringify({
                summary: $("#agent-summary-input")?.value || "",
                context_files: currentContextFiles,
              }),
            });
            currentContextFiles = session.context_files || [];
            if (status) status.textContent = "已保存";
            refreshContextStatus();
          } catch (error) {
            if (status) status.textContent = `保存失败：${error.message}`;
          }
        }

        // ---- Checkpoints ----
        async function openCheckpointDialog() {
          if (!currentSessionId) return;
          const dialog = $("#agent-checkpoint-dialog");
          const body = $("#agent-checkpoint-body");
          if (body) body.innerHTML = "加载中…";
          dialog?.showModal();
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/checkpoints`);
            const checkpoints = data.checkpoints || [];
            if (!body) return;
            if (!checkpoints.length) {
              body.innerHTML = '<div style="color: var(--muted); font-size: var(--font-size-tier-2);">当前会话工作目录下还没有检查点。可以让智能体使用 create_checkpoint 创建，或确认目录已纳入 Git。</div>';
              return;
            }
            body.innerHTML = checkpoints.map(checkpoint => `
              <div class="agent-checkpoint-row">
                <span class="agent-checkpoint-id" title="${escapeAttr(checkpoint.checkpoint_id)}">${escapeHtml(checkpoint.checkpoint_id)}</span>
                <span class="agent-checkpoint-meta">${formatBytes(checkpoint.bytes)}</span>
                <button class="agent-terminal-action" type="button" data-restore-checkpoint="${escapeAttr(checkpoint.checkpoint_id)}">撤销</button>
              </div>`).join("");
          } catch (error) {
            if (body) body.innerHTML = `<div style="color: var(--warm); font-size: var(--font-size-tier-2);">${escapeHtml(error.message)}</div>`;
          }
        }

        async function restoreCheckpointAction(checkpointId) {
          if (!currentSessionId || !checkpointId) return;
          if (!confirm(`将反向应用检查点 ${checkpointId}，撤销其中包含的全部修改。继续？`)) return;
          const body = $("#agent-checkpoint-body");
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/checkpoints/${encodeURIComponent(checkpointId)}/restore`, { method: "POST" });
            const files = (data.files || []).join("、") || "无";
            if (body) body.innerHTML = `<div style="color: var(--accent); font-size: var(--font-size-tier-2);">已恢复检查点 ${escapeHtml(data.checkpoint_id || checkpointId)}，涉及文件：${escapeHtml(files)}</div>`;
          } catch (error) {
            if (body) body.insertAdjacentHTML("beforeend", `<div style="color: var(--warm); font-size: var(--font-size-tier-2); margin-top: 8px;">${escapeHtml(error.message)}</div>`);
          }
        }

        function formatBytes(bytes) {
          const value = Math.max(0, Number(bytes) || 0);
          if (value >= 1024 * 1024) return `${(value / (1024 * 1024)).toFixed(1)} MB`;
          if (value >= 1024) return `${(value / 1024).toFixed(1)} KB`;
          return `${value} B`;
        }

        // ---- Model switch ----
        function requestModelSwitch(model) {
          if (!currentSessionId || !model) return;
          const current = $("#agent-model-select")?.value;
          if (model === current) return;
          previousModel = current || "";
          pendingModelSwitch = model;
          $("#agent-model-switch-dialog")?.showModal();
        }

        async function confirmModelSwitch(clearHistory) {
          const model = pendingModelSwitch;
          pendingModelSwitch = null;
          $("#agent-model-switch-dialog")?.close();
          if (!currentSessionId || !model) return;
          if (clearHistory) {
            await apiJson(`/api/agent/sessions/${currentSessionId}/clear`, { method: "POST" });
          }
          await changeModel(model);
          if (clearHistory) await selectSession(currentSessionId);
        }

        // ---- Sandbox + approvals ----
        async function changeSandbox(mode) {
          if (!currentSessionId || !mode) return;
          try {
            await apiJson(`/api/agent/sessions/${currentSessionId}`, {
              method: "PUT",
              body: JSON.stringify({
                title: $("#agent-title-input")?.value || "",
                sandbox_mode: mode,
              }),
            });
            const select = $("#agent-sandbox-select");
            if (select) select.value = mode;
          } catch (error) {
            const messages = $("#agent-messages");
            messages?.insertAdjacentHTML("beforeend",
              `<div class="agent-error-banner">切换沙箱失败：${escapeHtml(error.message)}</div>`);
            scrollToBottom();
          }
        }

        async function refreshApprovals() {
          const badge = $("#agent-approvals-badge");
          if (!badge) return;
          if (!currentSessionId) {
            badge.textContent = "0";
            return;
          }
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/approvals`);
            const pending = (data.approvals || []).filter(item => item.status === "pending").length;
            badge.textContent = String(pending);
          } catch {
            badge.textContent = "0";
          }
        }

        async function openApprovalsDialog() {
          if (!currentSessionId) return;
          $("#agent-approvals-dialog")?.showModal();
          await renderApprovals();
        }

        async function renderApprovals() {
          const body = $("#agent-approvals-body");
          if (!body) return;
          const policySelect = $("#agent-approval-policy-select");
          if (policySelect) policySelect.value = currentSessionApprovalPolicy || "ask_once";
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/approvals`);
            const approvals = data.approvals || [];
            refreshApprovals();
            if (!approvals.length) {
              body.innerHTML = '<div style="color: var(--muted); font-size: var(--font-size-tier-2);">暂无批准请求。授权方式：' +
                (currentSessionApprovalPolicy === "allow_all"
                  ? "允许全部（不再询问）"
                  : (currentSessionApprovalPolicy === "ask_each" ? "每次询问" : "只问一次（允许首条后不再询问）")) +
                '</div>';
              return;
            }
            body.innerHTML = approvals.slice().reverse().map(item => {
              const statusText = item.status === "pending"
                ? "待批准"
                : (item.status === "approved" ? "已允许" : "已拒绝");
              const actions = item.status === "pending"
                ? `<button class="agent-terminal-action" type="button" data-approval-allow="${escapeAttr(item.id)}">允许</button><button class="agent-terminal-action" type="button" data-approval-deny="${escapeAttr(item.id)}">拒绝</button>`
                : "";
              return `
                <div class="agent-checkpoint-row">
                  <div style="flex:1; min-width:0; display:grid; gap:3px;">
                    <span class="agent-checkpoint-id">${escapeHtml(item.tool)}</span>
                    <span class="agent-approval-summary" title="${escapeAttr(item.summary)}">${escapeHtml(item.summary)}</span>
                    <span class="agent-checkpoint-meta">${statusText}</span>
                  </div>
                  ${actions}
                </div>`;
            }).join("");
          } catch (error) {
            body.innerHTML = `<div style="color: var(--warm); font-size: var(--font-size-tier-2);">${escapeHtml(error.message)}</div>`;
          }
        }

        function maybeShowApprovalPrompt(session) {
          if (!currentSessionId || approvalPromptDismissed.has(currentSessionId)) return;
          if ((session.sandbox_mode || "default") !== "default") return;
          if ((session.approval_policy || "ask_once") !== "ask_once") return;
          approvalPromptDismissed.add(currentSessionId);
          const messages = $("#agent-messages");
          if (!messages) return;
          const banner = document.createElement("div");
          banner.className = "agent-approval-prompt";
          banner.innerHTML = `
            <span class="agent-approval-prompt-text">本会话尚未授权危险命令。默认只问一次：允许首条请求后，本会话不再询问。</span>
            <button class="agent-terminal-action" type="button" data-approval-policy="allow_all">允许全部</button>
            <button class="agent-terminal-action" type="button" data-approval-policy="ask_each">每次询问</button>
            <button class="agent-terminal-action" type="button" data-approval-prompt-dismiss>保持默认</button>`;
          messages.prepend(banner);
        }

        async function changeApprovalPolicy(policy) {
          if (!currentSessionId || !policy) return;
          try {
            const session = await apiJson(`/api/agent/sessions/${currentSessionId}`, {
              method: "PUT",
              body: JSON.stringify({
                title: $("#agent-title-input")?.value || "",
                approval_policy: policy,
              }),
            });
            currentSessionApprovalPolicy = session.approval_policy || policy;
            const policySelect = $("#agent-approval-policy-select");
            if (policySelect) policySelect.value = currentSessionApprovalPolicy;
          } catch (error) {
            const messages = $("#agent-messages");
            messages?.insertAdjacentHTML("beforeend",
              `<div class="agent-error-banner">修改授权方式失败：${escapeHtml(error.message)}</div>`);
            scrollToBottom();
          }
        }

        async function allowAllApprovals() {
          if (!currentSessionId) return;
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/approvals/allow-all`, { method: "POST" });
            currentSessionApprovalPolicy = data.approval_policy || "allow_all";
            const policySelect = $("#agent-approval-policy-select");
            if (policySelect) policySelect.value = currentSessionApprovalPolicy;
            await renderApprovals();
            refreshApprovals();
            if (!isStreaming && lastTurn) await retryLastTurn();
          } catch (error) {
            $("#agent-approvals-body")?.insertAdjacentHTML("beforeend",
              `<div style="color: var(--warm); font-size: var(--font-size-tier-2); margin-top: 8px;">${escapeHtml(error.message)}</div>`);
          }
        }

        async function allowApproval(approvalId) {
          if (!currentSessionId || !approvalId) return;
          try {
            const data = await apiJson(`/api/agent/sessions/${currentSessionId}/approvals/${encodeURIComponent(approvalId)}/allow`, { method: "POST" });
            currentSessionApprovalPolicy = data.approval_policy || currentSessionApprovalPolicy;
            const policySelect = $("#agent-approval-policy-select");
            if (policySelect) policySelect.value = currentSessionApprovalPolicy;
            await renderApprovals();
            if (!isStreaming && lastTurn) await retryLastTurn();
          } catch (error) {
            $("#agent-approvals-body")?.insertAdjacentHTML("beforeend",
              `<div style="color: var(--warm); font-size: var(--font-size-tier-2); margin-top: 8px;">${escapeHtml(error.message)}</div>`);
          }
        }

        async function denyApproval(approvalId) {
          if (!currentSessionId || !approvalId) return;
          try {
            await apiJson(`/api/agent/sessions/${currentSessionId}/approvals/${encodeURIComponent(approvalId)}/deny`, { method: "POST" });
            await renderApprovals();
          } catch (error) {
            $("#agent-approvals-body")?.insertAdjacentHTML("beforeend",
              `<div style="color: var(--warm); font-size: var(--font-size-tier-2); margin-top: 8px;">${escapeHtml(error.message)}</div>`);
          }
        }

        // ---- Session management ----
        async function createSession() {
          const data = await apiJson("/api/agent/sessions", {
            method: "POST",
            body: JSON.stringify({ title: "", model: "", api_preset_id: "" }),
          });
          await loadSessions();
          await selectSession(data.id);
          return data;
        }

        async function createProfileSession(profileId) {
          const data = await apiJson("/api/agent/sessions", {
            method: "POST",
            body: JSON.stringify({ profile_id: profileId }),
          });
          await loadSessions();
          await selectSession(data.id);
          return data;
        }

        async function deleteSession(sessionId) {
          if (!confirm("确定删除此会话？")) return;
          await apiJson(`/api/agent/sessions/${sessionId}`, { method: "DELETE" });
          if (currentSessionId === sessionId) {
            currentSessionId = null;
            renderEmptyState();
          }
          await loadSessions();
        }

        async function clearSession() {
          if (!currentSessionId) return;
          if (!confirm("确定清空当前会话的所有消息？")) return;
          await apiJson(`/api/agent/sessions/${currentSessionId}/clear`, { method: "POST" });
          await selectSession(currentSessionId);
        }

        async function renameSession(title) {
          if (!currentSessionId || !title.trim()) return;
          await apiJson(`/api/agent/sessions/${currentSessionId}`, {
            method: "PUT",
            body: JSON.stringify({ title: title.trim() }),
          });
          await loadSessions();
        }

        async function changeModel(model) {
          if (!currentSessionId || !model) return;
          await apiJson(`/api/agent/sessions/${currentSessionId}`, {
            method: "PUT",
            body: JSON.stringify({ title: $("#agent-title-input")?.value || "", model }),
          });
          refreshContextStatus();
        }

        async function changePreset(presetId) {
          if (!currentSessionId) return;
          const preset = availablePresets.find(item => item.id === presetId);
          let model = preset?.model || "";
          if (!model) {
            try {
              const data = await apiJson("/api/agent/models");
              model = data.default || "";
            } catch {
              model = $("#agent-model-select")?.value || resolvedDefaultModel || "";
            }
          }
          const updated = await apiJson(`/api/agent/sessions/${currentSessionId}`, {
            method: "PUT",
            body: JSON.stringify({
              title: $("#agent-title-input")?.value || "",
              api_preset_id: presetId,
              model,
            }),
          });
          renderChatArea(updated);
          await loadPresets(updated.api_preset_id || "");
          await loadModels(updated.model, updated.api_preset_id || "");
        }

        function renderEmptyState() {
          $("#agent-chat-area").innerHTML = `
            <div class="agent-empty" id="agent-empty-state">
              <button class="agent-sidebar-toggle" type="button" data-agent-sidebar-toggle>菜单</button>
              <div class="agent-empty-icon">AI</div>
              <button class="agent-new-btn" id="agent-empty-new-session" style="margin-bottom: 8px;">+ 新建会话</button>
              <div class="agent-empty-text">或点击左上角菜单查看已有会话</div>
            </div>`;
          $("#agent-empty-new-session")?.addEventListener("click", createSession);
        }

        let resolvedDefaultModel = "";
        async function loadPresets(currentPresetId) {
          try {
            const data = await apiJson("/api/agent/api-presets");
            availablePresets = data.presets || [];
          } catch {
            availablePresets = [];
          }
          populatePresetSelect(currentPresetId);
        }

        function populatePresetSelect(currentPresetId) {
          const sel = $("#agent-session-preset-select");
          if (!sel) return;
          const missingPreset = currentPresetId
            && !availablePresets.some(preset => preset.id === currentPresetId);
          const options = ['<option value="">跟随 Agent 设置</option>'];
          if (missingPreset) {
            options.push(`<option value="${escapeAttr(currentPresetId)}">预设已删除</option>`);
          }
          options.push(...availablePresets.map(preset => {
            const model = preset.model ? ` · ${preset.model}` : "";
            return `<option value="${escapeAttr(preset.id)}">${escapeHtml(preset.name || preset.id)}${escapeHtml(model)}</option>`;
          }));
          sel.innerHTML = options.join("");
          sel.value = currentPresetId || "";
        }

        async function loadModels(currentModel, apiPresetId) {
          const preset = availablePresets.find(item => item.id === apiPresetId);
          if (preset) {
            availableModels = preset.model ? [preset.model] : [];
            resolvedDefaultModel = preset.model || currentModel || "";
            populateModelSelect(currentModel);
            return;
          }
          try {
            const data = await apiJson("/api/agent/models");
            availableModels = data.models || [];
            resolvedDefaultModel = data.default || "";
          } catch { availableModels = []; resolvedDefaultModel = ""; }
          populateModelSelect(currentModel);
        }

        function populateModelSelect(currentModel) {
          const sel = $("#agent-model-select");
          if (!sel) return;
          const model = currentModel || sel.value;
          const all = [...new Set([model, ...availableModels])];
          sel.innerHTML = all.map(m => `<option value="${escapeAttr(m)}" ${m === model ? 'selected' : ''}>${escapeHtml(m)}</option>`).join("");
        }

        // ---- Skill picker ----
        function findSkillTrigger(value, cursor) {
          const end = Math.max(0, Math.min(Number(cursor) || 0, value.length));
          const prefix = value.slice(0, end);
          const start = prefix.lastIndexOf("$");
          if (start < 0) return null;
          const previous = value.slice(0, start).slice(-1);
          if (previous && /[\p{L}\p{N}_-]/u.test(previous)) return null;
          const query = value.slice(start + 1, end);
          if (query.includes("\n") || query.includes("\r")) return null;
          return { start, end, query };
        }

        function skillMatchScore(skill, query) {
          const normalize = (value) => String(value || "").normalize("NFKD").toLowerCase();
          const normalizedQuery = normalize(query).trim();
          if (!normalizedQuery) return 0;
          const compactQuery = normalizedQuery.replace(/[^\p{L}\p{N}]/gu, "");
          if (!compactQuery) return Number.POSITIVE_INFINITY;
          const compactName = normalize(skill?.name).replace(/[^\p{L}\p{N}]/gu, "");
          const compactDescription = normalize(skill?.description).replace(/[^\p{L}\p{N}]/gu, "");
          if (compactName === compactQuery) return 0;
          if (compactName.startsWith(compactQuery)) return 10 + compactName.length - compactQuery.length;
          const nameIndex = compactName.indexOf(compactQuery);
          if (nameIndex >= 0) return 30 + nameIndex;
          const descriptionIndex = compactDescription.indexOf(compactQuery);
          if (descriptionIndex >= 0) return 100 + descriptionIndex;
          const subsequenceScore = (candidate) => {
            let position = 0;
            let gaps = 0;
            for (const character of compactQuery) {
              const found = candidate.indexOf(character, position);
              if (found < 0) return Number.POSITIVE_INFINITY;
              gaps += found - position;
              position = found + 1;
            }
            return gaps;
          };
          const nameSubsequence = subsequenceScore(compactName);
          if (Number.isFinite(nameSubsequence)) return 200 + nameSubsequence;
          const descriptionSubsequence = subsequenceScore(compactDescription);
          if (Number.isFinite(descriptionSubsequence)) return 300 + descriptionSubsequence;
          return Number.POSITIVE_INFINITY;
        }

        function rankSkills(skills, query) {
          return (skills || [])
            .filter((skill) => !skill?.disabled)
            .map((skill) => ({ skill, score: skillMatchScore(skill, query) }))
            .filter((entry) => Number.isFinite(entry.score))
            .sort((left, right) => left.score - right.score || String(left.skill.name).localeCompare(String(right.skill.name), "zh-CN"))
            .map((entry) => entry.skill);
        }

        function insertSkillReference(value, trigger, skillName) {
          const prefix = value.slice(0, trigger.start);
          const suffix = value.slice(trigger.end);
          const reference = `$${skillName}`;
          let separator = "";
          let cursor = prefix.length + reference.length;
          if (!suffix) {
            separator = " ";
            cursor += 1;
          } else if (/^[ \t]/.test(suffix)) {
            cursor += 1;
          } else {
            separator = " ";
            cursor += 1;
          }
          return { value: `${prefix}${reference}${separator}${suffix}`, cursor };
        }

        function isCompletedSkillReference(query, skills) {
          const value = String(query || "").toLowerCase();
          return (skills || []).some((skill) => {
            if (skill?.disabled) return false;
            const name = String(skill?.name || "").toLowerCase();
            return name && value.startsWith(name) && /^\s/.test(value.slice(name.length));
          });
        }

        function loadSkillChoices() {
          if (!skillChoicesPromise) {
            skillChoicesPromise = apiJson("/api/agent/skills")
              .then((data) => {
                availableSkills = Array.isArray(data.skills) ? data.skills : [];
                return availableSkills;
              })
              .catch((error) => {
                availableSkills = null;
                skillChoicesPromise = null;
                throw error;
              });
          }
          return skillChoicesPromise;
        }

        function setSkillPickerExpanded(expanded) {
          const picker = $("#agent-skill-picker");
          const input = $("#agent-input");
          const button = $("#agent-skill-button");
          if (!picker || !input || !button) return;
          picker.hidden = !expanded;
          input.setAttribute("aria-expanded", String(expanded));
          button.setAttribute("aria-expanded", String(expanded));
          if (!expanded) {
            input.removeAttribute("aria-activedescendant");
            visibleSkills = [];
          }
        }

        function renderSkillPicker(status = "") {
          const options = $("#agent-skill-options");
          const count = $("#agent-skill-picker .agent-skill-picker-count");
          if (!options || !count) return;
          const availableCount = (availableSkills || []).filter((skill) => !skill.disabled).length;
          count.textContent = availableSkills ? `${visibleSkills.length} / ${availableCount}` : "加载中";
          if (status) {
            options.innerHTML = `<div class="agent-skill-empty" role="status">${escapeHtml(status)}</div>`;
            return;
          }
          if (!visibleSkills.length) {
            options.innerHTML = '<div class="agent-skill-empty" role="status">没有匹配的 Skill</div>';
            return;
          }
          options.innerHTML = visibleSkills.map((skill, index) => `
            <button class="agent-skill-option ${index === activeSkillIndex ? 'active' : ''}" id="agent-skill-option-${index}" type="button" role="option" aria-selected="${index === activeSkillIndex}" data-skill-index="${index}">
              <span class="agent-skill-name">$${escapeHtml(skill.name)}</span>
              <span class="agent-skill-description">${escapeHtml(skill.description || skill.source || '')}</span>
            </button>
          `).join("");
          setActiveSkillIndex(activeSkillIndex);
        }

        function setActiveSkillIndex(index) {
          if (!visibleSkills.length) return;
          activeSkillIndex = (index + visibleSkills.length) % visibleSkills.length;
          const input = $("#agent-input");
          $$("#agent-skill-options .agent-skill-option").forEach((option, optionIndex) => {
            const active = optionIndex === activeSkillIndex;
            option.classList.toggle("active", active);
            option.setAttribute("aria-selected", String(active));
            if (active) {
              input?.setAttribute("aria-activedescendant", option.id);
              option.scrollIntoView({ block: "nearest" });
            }
          });
        }

        function chooseSkill(index = activeSkillIndex) {
          const input = $("#agent-input");
          const skill = visibleSkills[index];
          const trigger = input && findSkillTrigger(input.value, input.selectionStart);
          if (!input || !skill || !trigger) return;
          const inserted = insertSkillReference(input.value, trigger, skill.name);
          input.value = inserted.value;
          input.setSelectionRange(inserted.cursor, inserted.cursor);
          autoResize(input);
          setSkillPickerExpanded(false);
          input.focus();
        }

        async function refreshSkillPicker() {
          const input = $("#agent-input");
          const trigger = input && findSkillTrigger(input.value, input.selectionStart);
          if (!input || !trigger) {
            setSkillPickerExpanded(false);
            return;
          }
          setSkillPickerExpanded(true);
          renderSkillPicker("正在加载 Skills...");
          try {
            const skills = await loadSkillChoices();
            const latestTrigger = findSkillTrigger(input.value, input.selectionStart);
            if (!latestTrigger) {
              setSkillPickerExpanded(false);
              return;
            }
            if (isCompletedSkillReference(latestTrigger.query, skills)) {
              setSkillPickerExpanded(false);
              return;
            }
            visibleSkills = rankSkills(skills, latestTrigger.query);
            activeSkillIndex = 0;
            renderSkillPicker();
          } catch (error) {
            renderSkillPicker(error.message || "Skill 列表加载失败");
          }
        }

        async function openFullSkillList() {
          const input = $("#agent-input");
          if (!input) return;
          input.focus();
          let skills = availableSkills;
          try { skills = await loadSkillChoices(); } catch {}
          const cursor = input.selectionStart ?? input.value.length;
          const trigger = findSkillTrigger(input.value, cursor);
          if (trigger && !isCompletedSkillReference(trigger.query, skills)) {
            input.setRangeText("$", trigger.start, trigger.end, "end");
          } else {
            const prefix = input.value.slice(0, cursor);
            input.setRangeText(`${prefix && !/\s$/.test(prefix) ? " " : ""}$`, cursor, cursor, "end");
          }
          autoResize(input);
          await refreshSkillPicker();
        }

        function closeSkillPicker() {
          setSkillPickerExpanded(false);
        }

        function fileToDataUrl(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ""));
            reader.onerror = () => reject(reader.error || new Error("读取图片失败"));
            reader.readAsDataURL(file);
          });
        }

        async function addImageAttachments(files) {
          for (const file of Array.from(files || [])) {
            if (pendingAttachments.length >= 8) break;
            if (!file.type.startsWith("image/") || file.size > 12 * 1024 * 1024) continue;
            pendingAttachments.push({
              name: file.name,
              mime_type: file.type,
              data_url: await fileToDataUrl(file),
            });
          }
          renderAttachmentPreview();
        }

        function renderAttachmentPreview() {
          const preview = $("#agent-attachment-preview");
          if (!preview) return;
          preview.classList.toggle("has-items", pendingAttachments.length > 0);
          preview.innerHTML = pendingAttachments.map((item, index) => `
            <div class="agent-attachment-chip">
              <img src="${escapeAttr(item.data_url)}" alt="${escapeAttr(item.name)}" />
              <button class="agent-attachment-remove" type="button" data-attachment-index="${index}" aria-label="移除图片">&times;</button>
            </div>`).join("");
        }

        // ---- Helpers ----
        function bindChatEvents() {
          const input = $("#agent-input");
          const sendBtn = $("#agent-send-btn");
          const titleInput = $("#agent-title-input");
          const skillButton = $("#agent-skill-button");
          const skillPicker = $("#agent-skill-picker");
          const attachmentInput = $("#agent-attachment-input");
          const attachmentPreview = $("#agent-attachment-preview");

          sendBtn.addEventListener("click", sendMessage);
          input.addEventListener("keydown", (e) => {
            if (!skillPicker.hidden && visibleSkills.length) {
              if (e.key === "ArrowDown") {
                e.preventDefault();
                setActiveSkillIndex(activeSkillIndex + 1);
                return;
              }
              if (e.key === "ArrowUp") {
                e.preventDefault();
                setActiveSkillIndex(activeSkillIndex - 1);
                return;
              }
              if (e.key === "Enter" || e.key === "Tab") {
                e.preventDefault();
                chooseSkill();
                return;
              }
            }
            if (e.key === "Escape" && !skillPicker.hidden) {
              e.preventDefault();
              closeSkillPicker();
              return;
            }
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });
          input.addEventListener("input", () => {
            autoResize(input);
            refreshSkillPicker();
          });
          input.addEventListener("click", refreshSkillPicker);
          input.addEventListener("blur", () => setTimeout(() => {
            if (!skillPicker.contains(document.activeElement) && document.activeElement !== skillButton) closeSkillPicker();
          }, 0));
          skillButton.addEventListener("click", openFullSkillList);
          attachmentInput?.addEventListener("change", async (event) => {
            await addImageAttachments(event.target.files);
            event.target.value = "";
          });
          attachmentPreview?.addEventListener("click", (event) => {
            const button = event.target.closest("[data-attachment-index]");
            if (!button) return;
            pendingAttachments.splice(Number(button.dataset.attachmentIndex), 1);
            renderAttachmentPreview();
          });
          skillPicker.addEventListener("pointerdown", (event) => {
            const option = event.target.closest("[data-skill-index]");
            if (option) {
              event.preventDefault();
              chooseSkill(Number(option.dataset.skillIndex));
            }
          });
          titleInput.addEventListener("change", (e) => renameSession(e.target.value));
          const modelSelect = $("#agent-model-select");
          modelSelect?.addEventListener("change", (e) => requestModelSwitch(e.target.value));
          const presetSelect = $("#agent-session-preset-select");
          presetSelect?.addEventListener("change", (e) => changePreset(e.target.value));
          const sandboxSelect = $("#agent-sandbox-select");
          sandboxSelect?.addEventListener("change", (e) => changeSandbox(e.target.value));
          $("#agent-compact-btn")?.addEventListener("click", compactCurrentSession);
          $("#agent-retry-btn")?.addEventListener("click", retryLastTurn);
          $("#agent-summary-btn")?.addEventListener("click", openSummaryDialog);
          $("#agent-checkpoint-btn")?.addEventListener("click", openCheckpointDialog);
          $("#agent-approvals-btn")?.addEventListener("click", openApprovalsDialog);
          $("#agent-run-refresh-btn")?.addEventListener("click", checkRunStatus);
          $("#agent-messages")?.addEventListener("click", (event) => {
            const button = event.target.closest("[data-restore-checkpoint]");
            if (button) restoreCheckpointAction(button.dataset.restoreCheckpoint);
          });
          $("#agent-clear-btn").addEventListener("click", clearSession);
          renderRetryButton();
        }

        function autoResize(el) {
          el.style.height = "auto";
          el.style.height = Math.min(el.scrollHeight, 180) + "px";
        }

        function scrollToBottom() {
          const div = $("#agent-messages");
          if (div) div.scrollTop = div.scrollHeight;
        }

        function escapeHtml(s) {
          if (!s) return "";
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function escapeAttr(s) {
          return escapeHtml(s).replace(/'/g, "&#39;");
        }
        function strVal(v) {
          if (typeof v === "string") return v;
          if (v == null) return "";
          return String(v);
        }
        function formatJson(s) {
          try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
        }
        function renderErrorBannerHtml(message) {
          const hint = String(message || "").includes("需要人工批准")
            ? '<div style="margin-top: 4px; color: var(--muted);">可在顶部「批准」中允许该请求，允许后会自动重试上一轮。</div>'
            : "";
          return `<div class="agent-error-banner">${escapeHtml(message)}${hint}</div>`;
        }

        // ---- Init ----
        function toggleSidebar() {
          const sidebar = $("#agent-sidebar");
          const backdrop = $("#agent-sidebar-backdrop");
          sidebar.classList.toggle("open");
          backdrop.classList.toggle("open", sidebar.classList.contains("open"));
        }
        function closeSidebar() {
          $("#agent-sidebar").classList.remove("open");
          $("#agent-sidebar-backdrop").classList.remove("open");
        }

        window.webClxNativeAgent = Object.freeze({
          openSession: async (sessionId) => {
            closeSidebar();
            return selectSession(sessionId);
          },
          createSession: async (profileId) => {
            closeSidebar();
            return createProfileSession(profileId);
          },
        });

        async function init() {
          await loadSessions();
          $("#agent-new-session").addEventListener("click", () => { closeSidebar(); createSession(); });
          $("#agent-empty-new-session")?.addEventListener("click", createSession);
          $("#agent-summary-save")?.addEventListener("click", saveSummary);
          $("#agent-model-switch-confirm")?.addEventListener("click", () => confirmModelSwitch(false));
          $("#agent-model-switch-clear")?.addEventListener("click", () => confirmModelSwitch(true));
          $("#agent-model-switch-cancel")?.addEventListener("click", () => {
            pendingModelSwitch = null;
            const modelSelect = $("#agent-model-select");
            if (modelSelect) modelSelect.value = previousModel;
            previousModel = "";
            $("#agent-model-switch-dialog")?.close();
          });
          document.addEventListener("click", (event) => {
            const restoreButton = event.target.closest("[data-restore-checkpoint]");
            if (restoreButton && event.target.closest("#agent-checkpoint-dialog")) {
              restoreCheckpointAction(restoreButton.dataset.restoreCheckpoint);
            }
          });
          document.addEventListener("click", (event) => {
            if (!event.target.closest("#agent-approvals-dialog")) return;
            const allowButton = event.target.closest("[data-approval-allow]");
            if (allowButton) {
              allowApproval(allowButton.dataset.approvalAllow);
              return;
            }
            const denyButton = event.target.closest("[data-approval-deny]");
            if (denyButton) denyApproval(denyButton.dataset.approvalDeny);
          });
          $("#agent-approvals-allow-all")?.addEventListener("click", allowAllApprovals);
          $("#agent-approval-policy-select")?.addEventListener("change", (event) => {
            changeApprovalPolicy(event.target.value);
          });
          document.addEventListener("click", (event) => {
            const policyButton = event.target.closest("[data-approval-policy]");
            if (policyButton) {
              const banner = policyButton.closest(".agent-approval-prompt");
              changeApprovalPolicy(policyButton.dataset.approvalPolicy);
              banner?.remove();
              return;
            }
            if (event.target.closest("[data-approval-prompt-dismiss]")) {
              event.target.closest(".agent-approval-prompt")?.remove();
            }
          });
          document.addEventListener("click", (event) => {
            const closeButton = event.target.closest("[data-agent-dialog-close]");
            if (closeButton) {
              const dialog = document.getElementById(closeButton.dataset.agentDialogClose);
              dialog?.close();
            }
          });
          document.addEventListener("click", (event) => {
            if (event.target.closest("[data-agent-sidebar-toggle]")) toggleSidebar();
          });
          $("#agent-sidebar-backdrop")?.addEventListener("click", closeSidebar);
          $("#agent-session-list").addEventListener("click", (e) => {
            const delBtn = e.target.closest(".session-delete");
            if (delBtn) {
              e.stopPropagation();
              deleteSession(delBtn.dataset.id);
              return;
            }
            const item = e.target.closest(".agent-session-item");
            if (item) { closeSidebar(); selectSession(item.dataset.id); }
          });
        }

        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
  </body>
