<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webClx Agent</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const mode = window.localStorage.getItem("webclx:theme-mode");
          let resolved;
          if (mode === "dark" || mode === "light") {
            resolved = mode;
          } else {
            resolved = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles-base.css?v=20260727b" />
    <link rel="stylesheet" href="/assets/styles-settings.css?v=20260715a" />
    <link rel="stylesheet" href="/assets/styles-auth.css?v=20260715a" />
    <link rel="stylesheet" href="/assets/styles-terminal.css?v=20260715a" />
    <link rel="stylesheet" href="/assets/styles-responsive.css?v=20260727b" />
    <script defer src="/assets/i18n.js?v=20260814a"></script>
    <style>
      .agent-page { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      .agent-main { flex: 1; display: flex; overflow: hidden; gap: 1px; background: var(--line); }
      .agent-sidebar {
        width: 240px; min-width: 240px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden;
      }
      .agent-sidebar-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .agent-new-btn {
        background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 6px 14px;
        font-size: var(--font-size-tier-3); cursor: pointer; white-space: nowrap; transition: background 0.15s;
      }
      .agent-new-btn:hover { background: var(--accent-strong); }
      .agent-sidebar-actions { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
      .agent-action-btn {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px;
        border: 1px solid var(--field-border); border-radius: 8px;
        background: var(--field-bg); color: var(--text);
        font-size: var(--font-size-tier-3); text-decoration: none;
        transition: border-color 0.15s, background 0.15s;
      }
      .agent-action-btn:hover { border-color: var(--accent); background: var(--field-bg-elevated); }
      .agent-action-icon { font-size: 14px; line-height: 1; color: var(--accent); }
      .agent-profile-head { padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .agent-profile-head strong { font-size: var(--font-size-tier-2); color: var(--text); }
      .agent-profile-add { width: 28px; height: 28px; padding: 0; border: 1px solid var(--field-border); border-radius: 6px; background: var(--field-bg); color: var(--text); cursor: pointer; }
      .agent-profile-list { display: grid; gap: 6px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); max-height: 42vh; overflow-y: auto; }
      .agent-profile-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--field-bg); }
      .agent-profile-name { font-size: var(--font-size-tier-3); font-weight: 600; color: var(--text); }
      .agent-profile-title-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .agent-profile-type { flex: none; border: 1px solid var(--field-border); border-radius: 5px; padding: 2px 5px; color: var(--muted); background: var(--panel); font-size: var(--font-size-tier-1); line-height: 1; }
      .agent-profile-description { margin-top: 4px; color: var(--muted); font-size: var(--font-size-tier-1); line-height: 1.45; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
      .agent-profile-controls { display: grid; grid-template-columns: repeat(4, minmax(42px, 1fr)); gap: 5px; margin-top: 7px; }
      .agent-profile-controls button { min-width: 42px; min-height: 28px; border: 1px solid var(--field-border); border-radius: 6px; padding: 3px 7px; background: var(--panel); color: var(--text); font-size: var(--font-size-tier-1); line-height: 1; white-space: nowrap; cursor: pointer; }
      .agent-profile-controls .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
      .agent-profile-status { padding: 0 12px 8px; font-size: var(--font-size-tier-1); color: var(--muted); }
      .agent-profile-status[data-tone="error"] { color: var(--warm); }
      .agent-profile-dialog { width: min(680px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--panel); color: var(--text); }
      .agent-profile-dialog::backdrop { background: rgba(0,0,0,0.4); }
      .agent-profile-form { padding: 18px; display: grid; gap: 14px; }
      .agent-profile-form-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .agent-profile-form-head h2 { margin: 0; font-size: var(--font-size-tier-5); }
      .agent-profile-close { border: 0; background: transparent; color: var(--text); font-size: 22px; cursor: pointer; }
      .agent-profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .agent-profile-field { display: grid; gap: 5px; font-size: var(--font-size-tier-2); color: var(--text); }
      .agent-profile-field.full { grid-column: 1 / -1; }
      .agent-profile-field input, .agent-profile-field select, .agent-profile-field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--field-border); border-radius: 6px; background: var(--field-bg); color: var(--text); padding: 8px; font: inherit; }
      .agent-profile-form-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .agent-session-list { flex: 1; overflow-y: auto; padding: 6px 0; }
      .agent-session-item {
        padding: 9px 14px; cursor: pointer; font-size: var(--font-size-tier-3); color: var(--text);
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        border-left: 3px solid transparent; transition: background 0.1s;
      }

      [data-theme="dark"] .agent-session-item:hover { background: rgba(255,255,255,0.05); }
      .agent-session-item.active { border-left-color: var(--accent); background: rgba(15,122,98,0.08); }
      .agent-session-item .session-delete {

      }

      .agent-session-item .session-delete:hover { opacity: 1; }

      .agent-chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
      .agent-terminal-shell { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
      .agent-terminal-toolbar { min-height: 42px; padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; background: var(--panel); }
      .agent-terminal-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: var(--font-size-tier-3); }

      .agent-terminal-action:hover { border-color: var(--accent); background: var(--field-bg-elevated); }
      .agent-terminal-session-switcher { width: min(220px, 34vw); min-width: 112px; text-overflow: ellipsis; }
      .agent-terminal-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
      .agent-terminal-frame { width: 100%; height: 100%; border: 0; background: var(--bg); opacity: 0; pointer-events: none; }
      .agent-terminal-pending { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 7px; padding: 24px; text-align: center; background: var(--bg); color: var(--muted); }
      .agent-terminal-pending strong { color: var(--text); font-size: var(--font-size-tier-4); }
      .agent-terminal-shell.ready .agent-terminal-frame { opacity: 1; pointer-events: auto; }
      .agent-terminal-shell.ready .agent-terminal-pending { display: none; }
      .agent-terminal-shell.failed .agent-terminal-pending strong { color: var(--warm); }
      .agent-chat-head {
        padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
        display: flex; align-items: center; gap: 12px; min-height: 48px;
      }
      .agent-chat-title { font-size: var(--font-size-tier-4); font-weight: 600; color: var(--text); flex: 1; }
      .agent-context-meter { width: 190px; min-width: 150px; display: grid; gap: 4px; }
      .agent-context-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: var(--font-size-tier-1); }
      .agent-context-track { height: 4px; overflow: hidden; border-radius: 2px; background: var(--line); }
      .agent-context-progress { display: block; width: 0; height: 100%; background: var(--accent); transition: width 0.2s ease, background 0.2s ease; }
      .agent-context-progress.warning { background: var(--warm); }
      .agent-chat-routing { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .agent-model-select {
        font-size: var(--font-size-tier-2); padding: 4px 8px; border: 1px solid var(--field-border);
        border-radius: 6px; background: var(--field-bg); color: var(--text); min-width: 120px; max-width: 200px;
      }
      .agent-preset-select { width: min(220px, 24vw); }

      .agent-messages { flex: 1; overflow-y: auto; padding: 20px 24px; scroll-behavior: smooth; }
      .agent-msg { margin-bottom: 16px; max-width: 860px; }
      .agent-msg-role {
        font-size: var(--font-size-tier-1); text-transform: uppercase; letter-spacing: 0.5px;
        color: var(--muted); margin-bottom: 4px; font-weight: 600;
      }
      .agent-msg-content { font-size: var(--font-size-tier-3); line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
      .agent-msg.user .agent-msg-content { background: var(--field-bg-elevated); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); }
      .agent-msg-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .agent-msg-images img { width: 112px; height: 84px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: var(--field-bg); }
      .agent-msg.assistant .agent-msg-role { color: var(--accent); }

      .agent-tool-card {
        margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 860px;
      }
      .agent-tool-head {
        padding: 7px 12px; background: var(--bg-accent); font-size: var(--font-size-tier-2);
        color: var(--text); display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
      }
      .agent-tool-head .tool-icon { font-size: 12px; width: 14px; text-align: center; }
      .agent-tool-head .tool-name { font-weight: 600; font-family: var(--font-family-mono); }
      .agent-tool-head .tool-badge {
        margin-left: auto; font-size: var(--font-size-tier-1); padding: 2px 8px; border-radius: 10px; font-weight: 600;
      }
      .tool-badge.running { background: rgba(15,122,98,0.15); color: var(--accent); }
      .tool-badge.ok { background: rgba(15,122,98,0.12); color: var(--accent); }
      .tool-badge.error { background: rgba(197,107,54,0.15); color: var(--warm); }
      .agent-tool-body { padding: 10px 12px; font-size: var(--font-size-tier-2); display: none; }
      .agent-tool-body.open { display: block; }
      .agent-tool-body pre {
        margin: 4px 0; padding: 8px 10px; background: var(--field-bg-code); border-radius: 6px;
        font-family: var(--font-family-mono); font-size: var(--font-size-tier-2); overflow-x: auto;
        white-space: pre-wrap; word-break: break-word; color: var(--text); max-height: 400px; overflow-y: auto;
      }
      [data-theme="dark"] .agent-tool-body pre { background: rgba(0,0,0,0.25); }
      .agent-tool-meta { color: var(--muted); font-size: var(--font-size-tier-1); margin-bottom: 4px; }

      .agent-input-area { padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--panel); }
      .agent-input-shell { position: relative; max-width: 860px; }
      .agent-input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
      .agent-attachment-preview { display: none; gap: 7px; margin: 0 0 8px 50px; overflow-x: auto; }
      .agent-attachment-preview.has-items { display: flex; }
      .agent-attachment-chip { position: relative; flex: none; width: 64px; height: 48px; }
      .agent-attachment-chip img { width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; }
      .agent-attachment-remove { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,0.72); color: #fff; cursor: pointer; }
      .agent-skill-button {
        flex: 0 0 42px; width: 42px; height: 42px; padding: 0; border: 1px solid var(--field-border);
        border-radius: 8px; background: var(--field-bg); color: var(--accent); font: 700 18px/1 var(--font-family-mono);
        cursor: pointer;
      }
      .agent-skill-button:hover, .agent-skill-button[aria-expanded="true"] { border-color: var(--accent); background: var(--field-bg-elevated); }
      .agent-skill-picker {
        position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 20;
        max-height: min(380px, 48vh); overflow: hidden; border: 1px solid var(--field-border);
        border-radius: 8px; background: var(--bg); box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      }
      .agent-skill-picker[hidden] { display: none; }
      .agent-skill-picker-head {
        height: 36px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--line); color: var(--text); font-size: var(--font-size-tier-2);
      }
      .agent-skill-picker-count { color: var(--muted); font-size: var(--font-size-tier-1); }
      .agent-skill-options { max-height: min(343px, calc(48vh - 37px)); overflow-y: auto; padding: 4px; }
      .agent-skill-option {
        width: 100%; min-height: 42px; padding: 7px 9px; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr);
        align-items: baseline; gap: 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text);
        text-align: left; cursor: pointer;
      }
      .agent-skill-option:hover, .agent-skill-option.active { background: var(--bg-accent); }
      .agent-skill-name { overflow: hidden; text-overflow: ellipsis; font: 600 var(--font-size-tier-2)/1.4 var(--font-family-mono); color: var(--accent); }
      .agent-skill-description { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: var(--font-size-tier-1); }
      .agent-skill-empty { padding: 20px 12px; text-align: center; color: var(--muted); font-size: var(--font-size-tier-2); }
      .agent-input {
        flex: 1; min-height: 42px; max-height: 180px; padding: 10px 14px; border: 1px solid var(--field-border);
        border-radius: 10px; background: var(--field-bg); color: var(--text); font-size: var(--font-size-tier-3);
        font-family: var(--font-family-sans); resize: none; line-height: 1.5; outline: none; transition: border-color 0.15s;
      }
      .agent-input:focus { border-color: var(--field-focus-border); box-shadow: var(--field-focus-ring); }
      .agent-input::placeholder { color: var(--muted); }
      .agent-send-btn {
        background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px;
        height: 42px; font-size: var(--font-size-tier-3); cursor: pointer; white-space: nowrap; transition: background 0.15s; font-weight: 600;
      }
      .agent-send-btn:hover:not(:disabled) { background: var(--accent-strong); }
      .agent-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .agent-hint { font-size: var(--font-size-tier-1); color: var(--muted); margin-top: 6px; }

      .agent-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 8px; }
      .agent-empty-icon { font-size: 48px; opacity: 0.3; }
      .agent-empty-text { font-size: var(--font-size-tier-3); }

      .agent-thinking { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: var(--font-size-tier-2); }
      .agent-thinking .dot { animation: pulse-dot 1.2s infinite; }
      .agent-thinking .dot:nth-child(2) { animation-delay: 0.2s; }
      .agent-thinking .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse-dot { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

      .agent-error-banner {
        padding: 8px 14px; background: rgba(197,107,54,0.1); border: 1px solid rgba(197,107,54,0.3);
        border-radius: 8px; color: var(--warm); font-size: var(--font-size-tier-2); margin: 8px 0;
      }
      .agent-status-banner {
        padding: 8px 14px; background: rgba(15,122,98,0.08); border: 1px solid rgba(15,122,98,0.25);
        border-radius: 8px; color: var(--accent); font-size: var(--font-size-tier-2); margin: 8px 0;
      }
      .agent-queued-banner {
        padding: 8px 14px; background: rgba(15,122,98,0.08); border: 1px solid rgba(15,122,98,0.25);
        border-radius: 8px; color: var(--accent); font-size: var(--font-size-tier-2); margin: 8px 0;
      }
      .agent-run-banner {
        padding: 7px 16px; background: rgba(15,122,98,0.08); border-bottom: 1px solid rgba(15,122,98,0.25);
        color: var(--accent); font-size: var(--font-size-tier-2); display: flex; align-items: center; gap: 10px;
      }
      .agent-run-banner button { flex: none; }
      .agent-reasoning {
        margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--field-bg);
        font-size: var(--font-size-tier-2); overflow: hidden;
      }
      .agent-reasoning summary { padding: 6px 12px; cursor: pointer; color: var(--muted); user-select: none; }
      .agent-reasoning-content {
        padding: 4px 12px 10px; color: var(--muted); white-space: pre-wrap; word-break: break-word;
        font-size: var(--font-size-tier-2); line-height: 1.55; max-height: 320px; overflow-y: auto;
      }
      .agent-checkpoint-restore {
        margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 10px; border: 1px solid var(--field-border); border-radius: 6px;
        background: var(--field-bg); color: var(--text); font-size: var(--font-size-tier-2); cursor: pointer;
      }
      .agent-checkpoint-restore:hover { border-color: var(--warm); color: var(--warm); }
      .agent-dialog { width: min(620px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: 8px; padding: 0; background: var(--panel); color: var(--text); }
      .agent-dialog::backdrop { background: rgba(0,0,0,0.4); }
      .agent-dialog-form { padding: 18px; display: grid; gap: 14px; }
      .agent-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .agent-dialog-head h2 { margin: 0; font-size: var(--font-size-tier-5); }
      .agent-dialog-body { display: grid; gap: 10px; }
      .agent-dialog-body textarea {
        width: 100%; box-sizing: border-box; min-height: 180px; resize: vertical;
        border: 1px solid var(--field-border); border-radius: 6px; background: var(--field-bg);
        color: var(--text); padding: 10px; font: inherit; line-height: 1.5;
      }
      .agent-dialog-files { display: flex; flex-wrap: wrap; gap: 6px; }
      .agent-file-chip {
        padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--field-bg);
        color: var(--muted); font-size: var(--font-size-tier-1); font-family: var(--font-family-mono);
      }
      .agent-checkpoint-row {
        padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field-bg);
        display: flex; align-items: center; gap: 10px; font-size: var(--font-size-tier-2); color: var(--text);
      }
      .agent-checkpoint-row .agent-checkpoint-id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-family-mono); }
      .agent-checkpoint-row .agent-checkpoint-meta { color: var(--muted); font-size: var(--font-size-tier-1); white-space: nowrap; }
      .agent-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .agent-model-switch-warn { padding: 10px 12px; border: 1px solid rgba(197,107,54,0.35); border-radius: 8px; background: rgba(197,107,54,0.08); color: var(--text); font-size: var(--font-size-tier-2); line-height: 1.55; }
      .agent-model-switch-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
      .agent-retry-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .agent-approvals-badge {
        margin-left: 4px; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px;
        background: var(--warm); color: #fff; font-size: 11px; font-weight: 700; display: inline-block;
        text-align: center; padding: 0 4px;
      }
      .agent-approvals-badge:empty { display: none; }
      .agent-approval-summary {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        color: var(--muted); font-size: var(--font-size-tier-1);
      }
      .agent-approval-policy-row {
        padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: var(--field-bg);
      }
      .agent-approval-prompt {
        padding: 9px 16px; background: rgba(15,122,98,0.08); border-bottom: 1px solid rgba(15,122,98,0.25);
        color: var(--text); font-size: var(--font-size-tier-2); display: flex; align-items: center;
        gap: 8px; flex-wrap: wrap;
      }
      .agent-approval-prompt .agent-approval-prompt-text { flex: 1; min-width: 220px; }

      .agent-sidebar-toggle {
        display: none;
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 6px 12px; font-size: var(--font-size-tier-2); cursor: pointer;
