<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const mode = window.localStorage.getItem("webclx:theme-mode");
          let resolved;
          if (mode === "dark" || mode === "light") {
            resolved = mode;
          } else {
            resolved = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {}
        try {
          const rawTiers = window.localStorage.getItem("webclx:font-size-tiers");
          if (rawTiers) {
            const tiers = JSON.parse(rawTiers);
            if (Array.isArray(tiers) && tiers.length >= 4) {
              const rootStyle = document.documentElement.style;
              rootStyle.setProperty("--font-size-tier-1", `${tiers[0]}rem`);
              rootStyle.setProperty("--font-size-tier-2", `${tiers[1]}rem`);
              rootStyle.setProperty("--font-size-tier-3", `${tiers[2]}rem`);
              rootStyle.setProperty("--font-size-tier-4", `${tiers[3]}rem`);
              const rawScale = window.localStorage.getItem("webclx:terminal-soft-keyboard-scale");
              const scale = Number(rawScale) > 0 ? Number(rawScale) : 1.08;
              rootStyle.setProperty(
                "--terminal-key-font-size",
                `${Math.round(tiers[2] * scale * 100) / 100}rem`,
              );
            }
          }
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles-base.css?v=20261025-android-language-once" />
    <link rel="stylesheet" href="/assets/styles-settings.css?v=20260925nav1" />
    <link rel="stylesheet" href="/assets/styles-auth.css?v=20260925nav1" />
    <link rel="stylesheet" href="/assets/styles-terminal.css?v=20260715a" />
    <link rel="stylesheet" href="/assets/styles-responsive.css?v=20260814a" />
    <script defer src="/assets/i18n.js?v=20261025-android-language-once"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="login-brand">
        <span class="login-logo">webClx</span>
      </div>
      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-field">
          <span class="login-label">账号</span>
          <input
            type="text"
            id="login-username"
            name="username"
            class="login-input"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
          />
        </label>
        <label class="login-field">
          <span class="login-label">密码</span>
          <input
            type="password"
            id="login-password"
            name="password"
            class="login-input"
            autocomplete="current-password"
            required
          />
        </label>
        <p id="login-error" class="login-error" hidden></p>
        <button type="submit" id="login-submit" class="login-submit">登录</button>
      </form>
    </main>
    <script defer src="/assets/login.js?v=20260822a"></script>
  </body>
</html>
