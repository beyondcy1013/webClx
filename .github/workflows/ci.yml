name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked

  browser-contracts:
    name: Browser and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run public-release contract tests
        run: >-
          node --test
          tests/source-release-package.test.mjs
          tests/security-client-redirects.test.mjs
          tests/builtin-terminal-message-skill.test.mjs
          tests/terminal-message-delivery.test.mjs
          tests/i18n-runtime.test.mjs
          tests/compile-api-compatibility.test.mjs
