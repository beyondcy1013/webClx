name: Hosted trial request
description: Join the waitlist for a seven-day isolated mobile development trial.
title: "[Hosted trial]: "
labels: ["hosted-trial"]
body:
  - type: markdown
    attributes:
      value: "This is a public form. Do not provide passwords, cookies, API keys, private repository URLs, customer data, or billing details. Model credentials are configured privately after an instance is provisioned."
  - type: dropdown
    id: region
    attributes:
      label: Preferred region
      options: [Asia, North America, Europe, No preference]
    validations:
      required: true
  - type: dropdown
    id: team_size
    attributes:
      label: Number of trial users
      options: [One, Two to five]
    validations:
      required: true
  - type: checkboxes
    id: harnesses
    attributes:
      label: Tools you want to access remotely
      options:
        - label: Codex
        - label: Claude
        - label: DeepSeek Harness
        - label: Shell only
  - type: textarea
    id: workflow
    attributes:
      label: Mobile or remote workflow to evaluate
      description: Describe the general workflow using public or synthetic project information only.
    validations:
      required: true
  - type: dropdown
    id: timing
    attributes:
      label: Preferred start window
      options: [Within one week, Within one month, Later / research only]
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Trial boundaries
      options:
        - label: I understand this is a seven-day isolated trial followed by a seven-day read-only export window and deletion.
          required: true
        - label: I will not place credentials or private data in this public issue.
          required: true
