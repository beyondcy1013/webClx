name: Hosted trial request
description: Join the waitlist for a seven-day isolated mobile development trial.
title: "[Hosted trial]: "
labels: ["hosted-trial"]
body:
  - type: markdown
    attributes:
      value: "This is a public form. Do not provide an email address, passwords, cookies, API keys, private repository URLs, customer data, or billing details. Approved applicants will arrange a private contact path before provisioning. Model credentials are configured privately after an instance is ready."
  - type: dropdown
    id: source
    attributes:
      label: How did you find webClx?
      options:
        - GitHub
        - DEV / Hashnode
        - Indie Hackers
        - Hacker News
        - Reddit
        - Product Hunt
        - Chinese developer community
        - Friend or colleague
        - Other
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Preferred region
      options: [Asia, North America, Europe, No preference]
    validations:
      required: true
  - type: dropdown
    id: team_size
    attributes:
      label: Number of trial users
      options: [One, Two to five]
    validations:
      required: true
  - type: checkboxes
    id: harnesses
    attributes:
      label: Tools you want to access remotely
      options:
        - label: Codex
        - label: Claude
        - label: DeepSeek Harness
        - label: Shell only
  - type: textarea
    id: workflow
    attributes:
      label: What becomes painful when you leave your workstation?
      description: Describe the mobile or remote workflow using public or synthetic project information only. Examples include monitoring a build, checking deployment logs, resuming an Agent, or requesting a review.
    validations:
      required: true
  - type: dropdown
    id: hosting_preference
    attributes:
      label: Which setup would you evaluate?
      options:
        - Managed isolated instance
        - One-time deployment on my Linux server
        - Self-hosting without paid support
        - Small-team pilot
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: purchase_intent
    attributes:
      label: If the trial solves the workflow, which preview offer is realistic?
      options:
        - USD 8/month managed personal
        - USD 19/month managed professional
        - From USD 49 one-time deployment support
        - From USD 59/month small-team pilot
        - Free self-hosting only
        - Need to evaluate first
    validations:
      required: true
  - type: dropdown
    id: timing
    attributes:
      label: Preferred start window
      options: [Within one week, Within one month, Later / research only]
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Trial boundaries
      options:
        - label: I understand this is a seven-day isolated trial followed by a seven-day read-only export window and deletion.
          required: true
        - label: I will not place contact details, credentials, or private data in this public issue.
          required: true
