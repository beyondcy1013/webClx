name: Feature request
description: Propose an outcome or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow and why current behavior is costly or difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request contains no credentials, private URLs, or customer data.
          required: true
