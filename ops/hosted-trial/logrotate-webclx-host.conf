/var/log/messages {
    daily
    rotate 7
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    create 0600 root root
    sharedscripts
    postrotate
        /bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
    endscript
}

/var/log/tinyproxy/tinyproxy.log {
    daily
    rotate 7
    size 50M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 tinyproxy tinyproxy
    sharedscripts
    postrotate
        /bin/systemctl kill -s HUP tinyproxy.service >/dev/null 2>&1 || true
    endscript
}
