[package]
name = "settings_core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
runtime_paths_core = { path = "../runtime_paths_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["fs"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt"] }
