[package]
name = "webclx"
version = "1.8.11"
edition = "2024"

[workspace]
members = [
    "crates/api_catalog_core",
    "crates/auth_core",
    "crates/codex_proxy_core",
    "crates/runtime_paths_core",
    "crates/settings_core",
    "crates/terminal_core",
]

[dependencies]
anyhow = "1.0"
api_catalog_core = { path = "crates/api_catalog_core" }
argon2 = "0.5"
auth_core = { path = "crates/auth_core" }
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
hmac = "0.13"
hex = "0.4"
codex_proxy_core = { path = "crates/codex_proxy_core" }
flate2 = "1.0"
futures-util = "0.3"
include_dir = "0.7"
percent-encoding = "2"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
runtime_paths_core = { path = "crates/runtime_paths_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
settings_core = { path = "crates/settings_core" }
tar = "0.4"
terminal_core = { path = "crates/terminal_core" }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.44", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml_edit = "0.22"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
webpki-roots = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
